- name: Deploiement de la todolist
  hosts: my_infra
  become: true
  vars:
    app_dir: /opt/todolist
    venv_dir: /opt/todolist/venv
    wheels_dir: /tmp/wheels
    repo_url: https://github.com/jlnvi/to-do-list-unsecure.git
    # Branche a deployer, passee par Jenkins (-e git_branch=...)
    git_branch: main

  handlers:
    - name: Redemarrer Gunicorn
      ansible.builtin.shell: |
        kill $(cat /run/todolist.pid) 2>/dev/null || true
        rm -f /run/todolist.pid
        sleep 1
        {{ venv_dir }}/bin/gunicorn --chdir {{ app_dir }} --bind 0.0.0.0:80 --daemon --pid /run/todolist.pid todo.wsgi:application

  tasks:
    # J2 Ex3 : la prod ne recoit QUE du code valide (branche main)
    - name: Regle de securite - la prod ne deploie que main
      ansible.builtin.assert:
        that: app_env != "prod" or git_branch == "main"
        fail_msg: "REFUS : la prod ne peut recevoir que la branche main (demande : {{ git_branch }})"
        success_msg: "OK : branche {{ git_branch }} autorisee sur {{ inventory_hostname }}"

    - name: Verifier la connexion aux VM
      ansible.builtin.ping:

    - name: Installer les paquets systeme
      ansible.builtin.apt:
        name:
          - python3
          - python3-venv
          - python3-pip
          - git
        state: present
        update_cache: true
        cache_valid_time: 3600
        install_recommends: false

    - name: Creer le dossier de l'application
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: admin
        group: admin
        mode: "0755"

    - name: Recuperer les sources depuis GitHub (branche {{ git_branch }})
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        version: "{{ git_branch }}"
        dest: "{{ app_dir }}"
        force: true
      become: false
      notify: Redemarrer Gunicorn

    - name: Passer Django en mode production (DEBUG = False)
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/todo/settings.py"
        regexp: '^DEBUG\s*='
        line: "DEBUG = False"
      when: app_env == "prod"
      become: false
      notify: Redemarrer Gunicorn

    - name: Verifier la presence des wheels
      ansible.builtin.stat:
        path: "{{ wheels_dir }}"
      register: wheels

    - name: Stopper si les wheels sont absents
      ansible.builtin.assert:
        that: wheels.stat.exists
        fail_msg: "{{ wheels_dir }} absent sur {{ inventory_hostname }} : recopier les wheels"

    - name: Installer les dependances Python (sans Internet)
      ansible.builtin.pip:
        name:
          - "django>=5.2,<6"
          - pyyaml
          - requests
          - gunicorn
        virtualenv: "{{ venv_dir }}"
        virtualenv_command: python3 -m venv
        extra_args: "--no-index --find-links {{ wheels_dir }}"

    - name: Appliquer les migrations Django
      ansible.builtin.command:
        cmd: "{{ venv_dir }}/bin/python manage.py migrate --noinput"
        chdir: "{{ app_dir }}"
      register: migrate_result
      changed_when: "'No migrations to apply' not in migrate_result.stdout"

    - name: Lancer Gunicorn en arriere-plan
      ansible.builtin.command:
        cmd: >
          {{ venv_dir }}/bin/gunicorn
          --chdir {{ app_dir }}
          --bind 0.0.0.0:80
          --daemon
          --pid /run/todolist.pid
          todo.wsgi:application
        creates: /run/todolist.pid

    - name: Appliquer les redemarrages en attente
      ansible.builtin.meta: flush_handlers

    - name: Verifier que la todolist repond (HTTP 200)
      ansible.builtin.uri:
        url: "http://{{ app_ip }}/"
        status_code: 200
      register: check
      until: check.status == 200
      retries: 5
      delay: 3
